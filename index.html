<html>
<head><meta name="x-codeium-csrf-token" content="33cd1a0a-18a3-4795-bf64-2e4fb717a433"><script src="/cascade-browser-integration.js" nonce="ba26f9db5fb74042a60d18d33385a78d"></script>
<meta charset="utf-8">
<title>BRICK SORTER 9000 — 60 Second Meltdown</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#05050a; display:flex; justify-content:center; align-items:center; height:100vh; font-family:'Press Start 2P', monospace; overflow:hidden; }
  canvas { image-rendering:pixelated; box-shadow:0 0 60px #4af3, 0 0 120px #f0f1; border-radius:8px; }
</style>
</head>
<body>
<canvas id="game" width="960" height="640"></canvas>
<script>
"use strict";
const cv = document.getElementById("game"), ctx = cv.getContext("2d");
const W = 960, H = 640;

// ---------- AUDIO ----------
let AC = null;
function audio(){ if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)(); return AC; }
function beep(freq, dur, type="square", vol=0.15, slide=0){
  try{
    const ac = audio(), o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, ac.currentTime);
    if(slide) o.frequency.linearRampToValueAtTime(Math.max(20,freq+slide), ac.currentTime+dur);
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+dur);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+dur);
  }catch(e){}
}
const SFX = {
  sort:  ()=>{ beep(600,.08,"square",.12,300); beep(900,.1,"square",.08); },
  wrong: ()=>{ beep(180,.25,"sawtooth",.15,-100); },
  miss:  ()=>{ beep(140,.3,"sawtooth",.18,-80); },
  gold:  ()=>{ [880,1100,1320,1760].forEach((f,i)=>setTimeout(()=>beep(f,.12,"square",.12),i*60)); },
  count: ()=>beep(440,.15,"square",.15),
  go:    ()=>beep(880,.3,"square",.18,200),
  win:   ()=>{ [523,659,784,1047,784,1047,1319].forEach((f,i)=>setTimeout(()=>beep(f,.18,"square",.14),i*120)); },
  lose:  ()=>{ [400,350,300,200,120].forEach((f,i)=>setTimeout(()=>beep(f,.3,"sawtooth",.15,-40),i*150)); },
  tick:  ()=>beep(1200,.05,"square",.08),
  jam:   ()=>beep(90,.4,"square",.2,-30),
};

// ---------- CONSTANTS ----------
const COLORS = [
  {name:"RED",   hex:"#e63b3b", dark:"#8f1d1d", key:"1"},
  {name:"YELLOW",hex:"#f2c811", dark:"#8f730a", key:"2"},
  {name:"BLUE",  hex:"#2e6fe8", dark:"#17407f", key:"3"},
  {name:"GREEN", hex:"#3cb54a", dark:"#1d6b27", key:"4"},
];
const QUOTA = 20;           // bricks needed to win
const TIME_LIMIT = 60;
const MAX_STRIKES = 3;
const BELT_Y = 180, BELT_H = 44;
const SORT_X = 780, SORT_ZONE_W = 110;   // sort zone near right end
const BIN_Y = 520, BIN_W = 130, BIN_H = 90, BIN_GAP = 30;
const BIN_X0 = (W - (BIN_W*4 + BIN_GAP*3)) / 2;

// ---------- STATE ----------
let state = "TITLE";   // TITLE | COUNTDOWN | PLAY | WIN | LOSE
let t = 0, bricks=[], particles=[], floaters=[], flyers=[];
let claw = {x:SORT_X+SORT_ZONE_W/2, anim:0, colorIdx:0};
let timeLeft, sorted, strikes, score, combo, spawnTimer, beltSpeed, countdownN, endTimer;
let shake = 0, flash = 0, strikesFlash = 0;
let beltOffset = 0, hazardLights = 0, winBricks = [];
let stateT = 0;

function resetGame(){
  bricks=[]; particles=[]; floaters=[]; flyers=[];
  timeLeft=TIME_LIMIT; sorted=0; strikes=0; score=0; combo=0;
  spawnTimer=0.4; beltSpeed=140; shake=0; flash=0; winBricks=[];
  claw.anim=0;
}

// ---------- INPUT ----------
addEventListener("keydown", e=>{
  const k = e.key;
  if(state==="TITLE" && (k===" "||k==="Enter")){ resetGame(); state="COUNTDOWN"; countdownN=3; stateT=0; SFX.count(); }
  else if((state==="WIN"||state==="LOSE") && (k===" "||k==="Enter")){ state="TITLE"; stateT=0; }
  else if(state==="PLAY"){
    const idx = COLORS.findIndex(c=>c.key===k);
    if(idx>=0) trySort(idx);
  }
});

function trySort(idx){
  claw.anim = 1; claw.colorIdx = idx;
  // find a brick inside sort zone
  const zoneL = SORT_X, zoneR = SORT_X + SORT_ZONE_W;
  const b = bricks.find(b=>b.x > zoneL-10 && b.x < zoneR && !b.gone);
  if(!b){ SFX.tick(); return; }
  b.gone = true;
  const correct = b.color === idx;
  if(correct){
    const gold = b.gold;
    sorted += gold?5:1; combo++;
    const pts = (gold?500:100) * (1 + Math.floor(combo/5)*0.5);
    score += pts;
    SFX[gold?"gold":"sort"]();
    flyers.push({...b, vx:0, vy:0, t:0, dur:.5, x0:b.x, y0:BELT_Y-14,
      x1:BIN_X0 + idx*(BIN_W+BIN_GAP) + BIN_W/2, y1:BIN_Y+10, gold});
    addFloater(`+${pts}`, b.x, BELT_Y-30, gold?"#ffd700":"#7CFC00");
    if(combo>0 && combo%5===0){ addFloater(`${combo} COMBO!`, W/2, 120, "#0ff", 20); shake=Math.max(shake,6); }
    burst(b.x, BELT_Y, gold?"#ffd700":COLORS[idx].hex, gold?30:14);
  } else {
    combo = 0; addStrike("WRONG BIN!");
    SFX.wrong();
    flyers.push({...b, t:0, dur:.45, x0:b.x, y0:BELT_Y-14, x1:W+60, y1:H+60, reject:true});
  }
}

function addStrike(msg){
  strikes++; strikesFlash = 1; shake = Math.max(shake,12); SFX.jam();
  addFloater(msg, SORT_X+SORT_ZONE_W/2, BELT_Y-50, "#ff4444", 16);
  if(strikes>=MAX_STRIKES){ endGame(false); }
}

function endGame(won){
  endTimer = 0;
  if(won){ state="WIN"; SFX.win(); for(let i=0;i<80;i++) confetti(); }
  else   { state="LOSE"; SFX.lose(); shake=20;
    for(let i=0;i<60;i++) burst(W/2+(Math.random()*200-100), BELT_Y+20, ["#ff6600","#ffcc00","#ff3333"][i%3], 1); }
}

// ---------- PARTICLES ----------
function burst(x,y,color,n){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, s = 60+Math.random()*200;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-100,life:.6+Math.random()*.5,color,size:2+Math.random()*4});
  }
}
function confetti(){
  particles.push({x:Math.random()*W, y:-10, vx:(Math.random()-.5)*80, vy:80+Math.random()*150,
    life:2+Math.random()*2, color:["#e63b3b","#f2c811","#2e6fe8","#3cb54a","#ff69b4","#0ff"][Math.floor(Math.random()*6)],
    size:4+Math.random()*5, spin:Math.random()*6});
}
function addFloater(text,x,y,color,size=12){ floaters.push({text,x,y,color,life:1.2,size}); }

// ---------- UPDATE ----------
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05,(now-last)/1000); last = now; t += dt; stateT += dt;
  update(dt); draw();
  requestAnimationFrame(loop);
}

function update(dt){
  beltOffset = (beltOffset + (state==="PLAY"?beltSpeed:40)*dt) % 40;
  shake = Math.max(0, shake - dt*30);
  flash = Math.max(0, flash - dt*3);
  strikesFlash = Math.max(0, strikesFlash - dt*2);
  claw.anim = Math.max(0, claw.anim - dt*4);
  hazardLights += dt*4;

  particles.forEach(p=>{ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=300*dt; p.life-=dt; });
  particles = particles.filter(p=>p.life>0 && p.y<H+20);
  floaters.forEach(f=>{ f.y-=30*dt; f.life-=dt; });
  floaters = floaters.filter(f=>f.life>0);
  flyers.forEach(f=>f.t+=dt/f.dur);
  const landed = flyers.filter(f=>f.t>=1 && !f.reject);
  landed.forEach(f=>{ burst(f.x1, f.y1+30, f.gold?"#ffd700":COLORS[f.color].hex, 12); });
  flyers = flyers.filter(f=>f.t<1);

  if(state==="COUNTDOWN"){
    const n = 3 - Math.floor(stateT);
    if(n !== countdownN){ countdownN = n; if(n>0) SFX.count(); else { SFX.go(); state="PLAY"; } }
  }

  if(state==="PLAY"){
    timeLeft -= dt;
    if(timeLeft<=10 && timeLeft+dt>10) addFloater("10 SECONDS!", W/2, 100, "#ff0", 24);
    if(Math.ceil(timeLeft) !== Math.ceil(timeLeft+dt) && timeLeft<=10 && timeLeft>0) SFX.tick();
    beltSpeed = 140 + (TIME_LIMIT-timeLeft)*3.5;
    spawnTimer -= dt;
    if(spawnTimer<=0){
      const gold = Math.random()<0.07;
      bricks.push({x:-40, color:Math.floor(Math.random()*4), gold, gone:false, wobble:Math.random()*6});
      spawnTimer = 1.0;
    }
    bricks.forEach(b=>b.x += beltSpeed*dt);
    // missed bricks fall off the end
    const missed = bricks.filter(b=>!b.gone && b.x > SORT_X+SORT_ZONE_W+30);
    missed.forEach(b=>{ b.gone=true; combo=0; addStrike("BRICK LOST!"); SFX.miss(); burst(b.x,BELT_Y+40,"#666",10); });
    bricks = bricks.filter(b=>!b.gone || b.x < SORT_X+SORT_ZONE_W+30);
    if(sorted>=QUOTA) endGame(true);
    else if(timeLeft<=0) endGame(false);
  }

  if(state==="WIN" && Math.random()<0.4) confetti();
  if(state==="WIN" && stateT>0.5 && winBricks.length<24 && Math.random()<0.15){
    winBricks.push({x:W/2+(Math.random()*400-200), y:H-40-winBricks.length*16, c:Math.floor(Math.random()*4)});
  }
}

// ---------- DRAW ----------
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fill(); }

function drawBrick(x,y,w,h,ci,gold){
  const c = COLORS[ci];
  const base = gold?"#ffd700":c.hex, dark = gold?"#a8842a":c.dark;
  ctx.fillStyle = dark; rr(x,y+3,w,h,3);
  ctx.fillStyle = base; rr(x,y,w,h-3,3);
  // studs
  const n = Math.max(2,Math.floor(w/16));
  ctx.fillStyle = base;
  for(let i=0;i<n;i++){ const sx=x+6+i*((w-12)/Math.max(1,n-1)); rr(sx-4,y-6,8,7,2); }
  ctx.fillStyle = "rgba(255,255,255,.35)";
  for(let i=0;i<n;i++){ const sx=x+6+i*((w-12)/Math.max(1,n-1)); rr(sx-3,y-5,4,3,1); }
  if(gold){ ctx.strokeStyle="#fff8"; ctx.lineWidth=2; ctx.strokeRect(x,y-6,w,h+3); }
}

function draw(){
  ctx.save();
  if(shake>0) ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);

  // bg
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#0a0a18"); g.addColorStop(1,"#141428");
  ctx.fillStyle=g; ctx.fillRect(-20,-20,W+40,H+40);
  // grid
  ctx.strokeStyle="#ffffff08"; ctx.lineWidth=1;
  for(let x=0;x<W;x+=40){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y=0;y<H;y+=40){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  drawMachine();
  drawBins();

  // bricks on belt
  bricks.forEach(b=>{
    if(b.gone) return;
    const bob = Math.sin(t*6+b.wobble)*2;
    if(b.x > SORT_X-5 && b.x < SORT_X+SORT_ZONE_W+5){
      ctx.shadowColor="#fff"; ctx.shadowBlur=15;
    }
    drawBrick(b.x-22, BELT_Y-16+bob, 44, 18, b.color, b.gold);
    ctx.shadowBlur=0;
  });

  // flyers
  flyers.forEach(f=>{
    const tt = Math.min(1,f.t), mx=(f.x0+f.x1)/2, my=Math.min(f.y0,f.y1)-120;
    const x=(1-tt)*(1-tt)*f.x0+2*(1-tt)*tt*mx+tt*tt*f.x1;
    const y=(1-tt)*(1-tt)*f.y0+2*(1-tt)*tt*my+tt*tt*f.y1;
    ctx.save(); ctx.translate(x,y); ctx.rotate(tt*6);
    drawBrick(-22,-9,44,18,f.color,f.gold); ctx.restore();
  });

  drawClaw();
  drawParticles();
  drawHUD();

  if(state==="TITLE") drawTitle();
  if(state==="COUNTDOWN") drawCountdown();
  if(state==="WIN") drawWin();
  if(state==="LOSE") drawLose();

  // scanlines + vignette
  ctx.fillStyle="rgba(0,0,0,.12)";
  for(let y=0;y<H;y+=4) ctx.fillRect(0,y,W,1);
  const v = ctx.createRadialGradient(W/2,H/2,H/3,W/2,H/2,H);
  v.addColorStop(0,"rgba(0,0,0,0)"); v.addColorStop(1,"rgba(0,0,0,.55)");
  ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
  ctx.restore();
}

function drawMachine(){
  // main conveyor frame
  ctx.fillStyle="#1c1c30"; rr(-10,BELT_Y,W+20,BELT_H,6);
  ctx.fillStyle="#262640"; rr(-10,BELT_Y+6,W+20,BELT_H-12,4);
  // belt stripes
  ctx.fillStyle="#30305a";
  for(let x=-40+beltOffset; x<W+40; x+=40){ ctx.fillRect(x,BELT_Y+8,20,BELT_H-16); }
  // hazard edge
  for(let x=-40+beltOffset; x<W+40; x+=40){
    ctx.fillStyle = (Math.floor((x-beltOffset)/40)%2)?"#f2c81133":"#00000033";
    ctx.fillRect(x,BELT_Y+BELT_H-6,20,4);
  }
  // rollers
  for(let x=30;x<W;x+=90){
    ctx.fillStyle="#3a3a5c"; ctx.beginPath(); ctx.arc(x,BELT_Y+BELT_H/2,12,0,7); ctx.fill();
    ctx.fillStyle="#555580"; ctx.beginPath(); ctx.arc(x,BELT_Y+BELT_H/2,5,0,7); ctx.fill();
  }
  // sort zone highlight
  const pulse = .15+.1*Math.sin(t*5);
  ctx.fillStyle=`rgba(0,255,255,${pulse})`; ctx.fillRect(SORT_X,BELT_Y-40,SORT_ZONE_W,BELT_H+50);
  ctx.strokeStyle="#0ff"; ctx.lineWidth=2; ctx.setLineDash([6,6]);
  ctx.strokeRect(SORT_X,BELT_Y-40,SORT_ZONE_W,BELT_H+50); ctx.setLineDash([]);
  ctx.fillStyle="#0ff"; ctx.font="10px 'Press Start 2P'"; ctx.textAlign="center";
  ctx.fillText("SORT ZONE",SORT_X+SORT_ZONE_W/2,BELT_Y-50);
  // pit at end
  ctx.fillStyle="#0a0a14"; rr(SORT_X+SORT_ZONE_W+30,BELT_Y,W,60,4);
  ctx.fillStyle="#ff444422"; ctx.fillRect(SORT_X+SORT_ZONE_W+30,BELT_Y,4,60);
  ctx.fillStyle="#f66"; ctx.font="8px 'Press Start 2P'";
  ctx.fillText("SCRAP",SORT_X+SORT_ZONE_W+90,BELT_Y+BELT_H+16);
  // legs
  ctx.fillStyle="#1c1c30";
  for(let x=80;x<W;x+=160){ ctx.fillRect(x,BELT_Y+BELT_H,16,H-BELT_Y-BELT_H-140); }
}

function drawBins(){
  COLORS.forEach((c,i)=>{
    const x = BIN_X0 + i*(BIN_W+BIN_GAP);
    // bin glow
    ctx.shadowColor=c.hex; ctx.shadowBlur=18;
    ctx.fillStyle="#151528"; rr(x,BIN_Y,BIN_W,BIN_H,8);
    ctx.shadowBlur=0;
    ctx.strokeStyle=c.hex; ctx.lineWidth=3; rr(x,BIN_Y,BIN_W,BIN_H,8); ctx.stroke();
    // fill level illusion
    ctx.fillStyle=c.hex+"44"; rr(x+4,BIN_Y+BIN_H-30,BIN_W-8,26,4);
    ctx.fillStyle=c.hex; ctx.font="14px 'Press Start 2P'"; ctx.textAlign="center";
    ctx.fillText(c.name, x+BIN_W/2, BIN_Y+BIN_H+30);
    // key cap
    ctx.fillStyle="#222"; rr(x+BIN_W/2-16, BIN_Y-38, 32, 28, 5);
    ctx.strokeStyle="#888"; ctx.lineWidth=2; rr(x+BIN_W/2-16, BIN_Y-38, 32, 28, 5); ctx.stroke();
    ctx.fillStyle="#fff"; ctx.font="12px 'Press Start 2P'";
    ctx.fillText(c.key, x+BIN_W/2, BIN_Y-19);
  });
}

function drawClaw(){
  const cx = SORT_X+SORT_ZONE_W/2;
  const drop = claw.anim>0 ? Math.sin((1-claw.anim)*Math.PI)*50 : 0;
  ctx.strokeStyle="#888"; ctx.lineWidth=6;
  ctx.beginPath(); ctx.moveTo(cx,0); ctx.lineTo(cx,BELT_Y-60+drop); ctx.stroke();
  ctx.fillStyle="#aaa"; rr(cx-14,BELT_Y-70+drop,28,20,4);
  // claw arms
  ctx.strokeStyle = claw.anim>0 ? COLORS[claw.colorIdx].hex : "#aaa";
  ctx.lineWidth=4;
  ctx.beginPath(); ctx.moveTo(cx-12,BELT_Y-50+drop); ctx.lineTo(cx-20,BELT_Y-34+drop); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx+12,BELT_Y-50+drop); ctx.lineTo(cx+20,BELT_Y-34+drop); ctx.stroke();
}

function drawParticles(){
  particles.forEach(p=>{
    ctx.globalAlpha = Math.min(1,p.life);
    ctx.fillStyle=p.color; ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
  });
  ctx.globalAlpha=1;
  floaters.forEach(f=>{
    ctx.globalAlpha=Math.min(1,f.life);
    ctx.fillStyle=f.color; ctx.font=`${f.size}px 'Press Start 2P'`; ctx.textAlign="center";
    ctx.fillText(f.text,f.x,f.y);
  });
  ctx.globalAlpha=1;
}

function drawHUD(){
  // top bar
  ctx.fillStyle="#000a"; ctx.fillRect(0,0,W,64);
  // timer
  const urgent = state==="PLAY" && timeLeft<=10;
  ctx.fillStyle = urgent && Math.floor(t*4)%2 ? "#ff3333" : "#fff";
  ctx.font="20px 'Press Start 2P'"; ctx.textAlign="left";
  ctx.fillText(state==="PLAY"||state==="WIN"||state==="LOSE" ? `TIME ${Math.max(0,Math.ceil(timeLeft))}` : "TIME 60", 20, 40);
  // score
  ctx.fillStyle="#ffd700"; ctx.textAlign="center";
  ctx.fillText(`SCORE ${String(score|0).padStart(6,"0")}`, W/2, 40);
  // quota
  ctx.fillStyle="#7CFC00"; ctx.textAlign="right";
  ctx.fillText(`SORTED ${Math.min(sorted,QUOTA)}/${QUOTA}`, W-20, 40);
  // strikes
  for(let i=0;i<MAX_STRIKES;i++){
    ctx.fillStyle = i<strikes ? (strikesFlash>.5?"#ff0":"#f33") : "#333";
    ctx.beginPath(); ctx.arc(30+i*26, 84, 8, 0, 7); ctx.fill();
    ctx.strokeStyle="#000"; ctx.stroke();
  }
  ctx.fillStyle="#888"; ctx.font="8px 'Press Start 2P'"; ctx.textAlign="left";
  ctx.fillText("JAMS", 20, 108);
  // progress bar
  ctx.fillStyle="#222"; rr(W/2-160,72,320,14,7);
  ctx.fillStyle="#7CFC00"; rr(W/2-158,74,316*Math.min(1,sorted/QUOTA),10,5);
  ctx.strokeStyle="#555"; rr(W/2-160,72,320,14,7); ctx.stroke();
  if(strikes>0){
    ctx.fillStyle=`rgba(255,0,0,${strikesFlash*.3})`; ctx.fillRect(0,0,W,H);
  }
}

function overlay(alpha=.75){ ctx.fillStyle=`rgba(0,0,10,${alpha})`; ctx.fillRect(0,0,W,H); }

function drawTitle(){
  overlay(.7);
  ctx.textAlign="center";
  const bob = Math.sin(t*2)*6;
  ctx.fillStyle="#f2c811"; ctx.font="44px 'Press Start 2P'";
  ctx.shadowColor="#f80"; ctx.shadowBlur=30;
  ctx.fillText("BRICK SORTER", W/2, 200+bob);
  ctx.fillStyle="#e63b3b"; ctx.fillText("9000", W/2, 260+bob);
  ctx.shadowBlur=0;
  // decorative bricks
  for(let i=0;i<6;i++) drawBrick(W/2-160+i*56, 300+bob*.5, 48, 20, i%4, i===3);
  ctx.fillStyle="#fff"; ctx.font="11px 'Press Start 2P'";
  ctx.fillText("SORT " + QUOTA + " BRICKS IN 60 SECONDS", W/2, 380);
  ctx.fillStyle="#0ff"; ctx.fillText("PRESS 1-4 AS BRICKS ENTER THE SORT ZONE", W/2, 410);
  ctx.fillStyle="#f66"; ctx.fillText("3 JAMS = MACHINE MELTDOWN", W/2, 440);
  ctx.fillStyle="#ffd700"; ctx.font="9px 'Press Start 2P'";
  ctx.fillText("GOLD BRICK = 5X SORT + 500 PTS", W/2, 470);
  if(Math.floor(t*2)%2){
    ctx.fillStyle="#fff"; ctx.font="16px 'Press Start 2P'";
    ctx.fillText("PRESS SPACE TO START", W/2, 540);
  }
}

function drawCountdown(){
  overlay(.5);
  ctx.textAlign="center";
  ctx.fillStyle = countdownN>0 ? "#fff" : "#7CFC00";
  ctx.font="80px 'Press Start 2P'";
  ctx.shadowColor = countdownN>0?"#fff":"#7CFC00"; ctx.shadowBlur=40;
  ctx.fillText(countdownN>0?countdownN:"GO!", W/2, H/2+30);
  ctx.shadowBlur=0;
}

function drawWin(){
  overlay(.55);
  // trophy tower of bricks
  winBricks.forEach(b=>drawBrick(b.x-30,b.y,60,14,b.c,false));
  ctx.textAlign="center";
  ctx.fillStyle="#7CFC00"; ctx.font="40px 'Press Start 2P'";
  ctx.shadowColor="#7CFC00"; ctx.shadowBlur=30;
  ctx.fillText("YOU WIN!", W/2, 180);
  ctx.shadowBlur=0;
  ctx.fillStyle="#ffd700"; ctx.font="16px 'Press Start 2P'";
  ctx.fillText("CERTIFIED MASTER SORTER", W/2, 230);
  ctx.fillStyle="#fff"; ctx.font="14px 'Press Start 2P'";
  ctx.fillText(`FINAL SCORE ${score|0}`, W/2, 290);
  ctx.fillText(`TIME LEFT ${Math.max(0,Math.ceil(timeLeft))}s`, W/2, 320);
  const grade = score>9000?"S":score>7000?"A":score>5000?"B":"C";
  ctx.fillStyle="#0ff"; ctx.font="30px 'Press Start 2P'";
  ctx.fillText(`RANK: ${grade}`, W/2, 380);
  if(Math.floor(t*2)%2){
    ctx.fillStyle="#aaa"; ctx.font="11px 'Press Start 2P'";
    ctx.fillText("SPACE TO PLAY AGAIN", W/2, 560);
  }
}

function drawLose(){
  overlay(.7);
  ctx.textAlign="center";
  ctx.fillStyle="#ff3333"; ctx.font="40px 'Press Start 2P'";
  ctx.shadowColor="#f00"; ctx.shadowBlur=30;
  ctx.fillText(strikes>=MAX_STRIKES?"MELTDOWN!":"TIME UP!", W/2, 200);
  ctx.shadowBlur=0;
  ctx.fillStyle="#fff"; ctx.font="13px 'Press Start 2P'";
  ctx.fillText(strikes>=MAX_STRIKES ? "THE MACHINE HAS JAMMED BEYOND REPAIR" : "QUOTA NOT MET — THE FACTORY DISAPPOINTED", W/2, 260);
  ctx.fillStyle="#ffd700"; ctx.fillText(`SCORE ${score|0}  ·  SORTED ${sorted}/${QUOTA}`, W/2, 310);
  ctx.fillStyle="#888"; ctx.font="11px 'Press Start 2P'";
  ctx.fillText("THE BRICKS ARE JUDGING YOU", W/2, 360);
  if(Math.floor(t*2)%2){
    ctx.fillStyle="#aaa";
    ctx.fillText("SPACE TO TRY AGAIN", W/2, 560);
  }
}

requestAnimationFrame(loop);
</script>
</body>
</html>
